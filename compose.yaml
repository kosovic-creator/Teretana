services:
  postgres:
    image: postgres:17-alpine
    container_name: puls-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: puls
    ports:
      - "5432:5432"
    volumes:
      - puls_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d puls"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  puls_postgres_data:
