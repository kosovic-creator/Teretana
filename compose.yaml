services:
  postgres:
    image: postgres:17-alpine
    container_name: hulk23-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hulk23
    ports:
      - "5432:5432"
    volumes:
      - hulk23_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hulk23"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hulk23_postgres_data:
