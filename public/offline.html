<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#131b16" />
    <title>Hulk23 — Nema veze</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #131b16; color: #fff; font-family: system-ui, sans-serif; }
      main { max-width: 420px; text-align: center; }
      .brand { color: #a9e057; font-size: 32px; font-weight: 800; }
      h1 { font-size: 26px; margin-top: 32px; }
      p { color: #c2cac4; line-height: 1.6; }
      button { margin-top: 16px; border: 0; border-radius: 12px; background: #a9e057; color: #131b16; padding: 14px 24px; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Hulk23</div>
      <h1>Nema veze sa serverom</h1>
      <p>Provjeri internet vezu i pokušaj ponovo. Za pregled i izmjenu članova, uplata i dolazaka potrebna je veza sa serverom.</p>
      <button type="button" onclick="window.location.reload()">Pokušaj ponovo</button>
    </main>
  </body>
</html>
